name: 'SonarQube Summary'
description: 'Publish issues/coverage/duplication metrics to the GitHub Actions job summary, and optionally fail on open issues of given severities/qualities'

inputs:
  project-key:
    description: 'SonarQube project key that was analyzed'
    required: true
  sonar-host-url:
    description: 'SonarQube server URL'
    required: true
  sonar-token:
    description: 'SonarQube auth token'
    required: true
  title:
    description: 'Title shown in the job summary section'
    required: false
    default: ''
  fail-on-severities:
    description: 'Comma-separated impact severities (HIGH, MEDIUM, LOW). The job fails if an open issue matches (empty = no issue gate).'
    required: false
    default: ''
  fail-on-qualities:
    description: 'Comma-separated software qualities (MAINTAINABILITY, RELIABILITY, SECURITY). Combined (AND) with fail-on-severities; empty = any quality.'
    required: false
    default: ''
  timeout:
    description: 'Seconds to wait for SonarQube to finish processing the analysis'
    required: false
    default: '600'

runs:
  using: 'composite'
  steps:
    - shell: bash
      env:
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        PROJECT_KEY: ${{ inputs.project-key }}
        SUMMARY_TITLE: ${{ inputs.title }}
        FAIL_ON_SEVERITIES: ${{ inputs.fail-on-severities }}
        FAIL_ON_QUALITIES: ${{ inputs.fail-on-qualities }}
        CE_TIMEOUT: ${{ inputs.timeout }}
      run: bash "${{ github.action_path }}/summary.sh"
