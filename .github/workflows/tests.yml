name: tests

on:
  workflow_call:
    inputs:
      branch:
        description: 'The branch that triggered this workflow.'
        required: true
        type: string
      api:
        description: 'Run the tests of the API service.'
        required: false
        type: boolean
        default: true
      cron:
        description: 'Run the tests of the CRON service.'
        required: false
        type: boolean
        default: true
      front:
        description: 'Run the tests of the FRONT service.'
        required: false
        type: boolean
        default: true
      notif:
        description: 'Run the tests of the NOTIF service.'
        required: false
        type: boolean
        default: true
      worker:
        description: 'Run the tests of the WORKER service.'
        required: false
        type: boolean
        default: true
      sonar_prefix:
        description: 'Prefix of the SonarQube project keys (defaults to the branch).'
        required: false
        type: string
        default: ''
      sonar_quality_gate:
        description: 'Make the SonarQube scan wait for, and fail on, the server-side Quality Gate (sonar.qualitygate.wait).'
        required: false
        type: boolean
        default: true
      sonar_fail_severities:
        description: 'Fail the job if an open SonarQube issue has one of these impact severities (comma-separated: HIGH,MEDIUM,LOW). Empty disables the check.'
        required: false
        type: string
        default: ''
      sonar_fail_qualities:
        description: 'Restrict sonar_fail_severities to these software qualities (comma-separated: MAINTAINABILITY,RELIABILITY,SECURITY). Empty means any quality; used alone it fails on any severity.'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      branch:
        description: 'The branch that triggered this workflow.'
        required: true
        type: string
      api:
        description: 'Run the tests of the API service.'
        required: false
        type: boolean
        default: true
      cron:
        description: 'Run the tests of the CRON service.'
        required: false
        type: boolean
        default: true
      front:
        description: 'Run the tests of the FRONT service.'
        required: false
        type: boolean
        default: true
      notif:
        description: 'Run the tests of the NOTIF service.'
        required: false
        type: boolean
        default: true
      worker:
        description: 'Run the tests of the WORKER service.'
        required: false
        type: boolean
        default: true
      sonar_prefix:
        description: 'Prefix of the SonarQube project keys (defaults to the branch).'
        required: false
        type: string
        default: ''
      sonar_quality_gate:
        description: 'Make the SonarQube scan wait for, and fail on, the server-side Quality Gate (sonar.qualitygate.wait).'
        required: false
        type: boolean
        default: true
      sonar_fail_severities:
        description: 'Fail the job if an open SonarQube issue has one of these impact severities (comma-separated: HIGH,MEDIUM,LOW). Empty disables the check.'
        required: false
        type: string
        default: ''
      sonar_fail_qualities:
        description: 'Restrict sonar_fail_severities to these software qualities (comma-separated: MAINTAINABILITY,RELIABILITY,SECURITY). Empty means any quality; used alone it fails on any severity.'
        required: false
        type: string
        default: ''

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      front: ${{ steps.plan.outputs.front }}
      backend: ${{ steps.plan.outputs.backend }}
      sonar_prefix: ${{ steps.plan.outputs.sonar_prefix }}
    steps:
    - name: Build matrix from selected services
      id: plan
      shell: bash
      env:
        API: ${{ inputs.api }}
        CRON: ${{ inputs.cron }}
        FRONT: ${{ inputs.front }}
        NOTIF: ${{ inputs.notif }}
        WORKER: ${{ inputs.worker }}
        SONAR_PREFIX: ${{ inputs.sonar_prefix || inputs.branch }}
      run: |
        backend=$(jq -nc \
          --argjson api "$API" --argjson notif "$NOTIF" --argjson cron "$CRON" \
          --argjson worker "$WORKER" '
          [
            {service_name: "API",    source_dir: "electrostoreAPI",    sonar_key: "electrostore-api",    coverage_exclusions: "**/Controllers/**,**/Program.cs", issue_ignores: "csharpsquid:S107|**/Services/AuthService/AuthService.cs", enabled: $api},
            {service_name: "NOTIF",  source_dir: "electrostoreNOTIF",  sonar_key: "electrostore-notif",  coverage_exclusions: "**/Program.cs",                   issue_ignores: "", enabled: $notif},
            {service_name: "CRON",   source_dir: "electrostoreCRON",   sonar_key: "electrostore-cron",   coverage_exclusions: "**/Program.cs",                   issue_ignores: "", enabled: $cron},
            {service_name: "WORKER", source_dir: "electrostoreWORKER", sonar_key: "electrostore-worker", coverage_exclusions: "**/Program.cs",                   issue_ignores: "", enabled: $worker}
          ] | map(select(.enabled) | del(.enabled))')
        {
          echo "front=$FRONT"
          echo "backend=$backend"
          echo "sonar_prefix=$SONAR_PREFIX"
        } >> "$GITHUB_OUTPUT"

  test-backend:
    name: tests - ${{ matrix.service_name }}
    needs: plan
    if: needs.plan.outputs.backend != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.backend) }}
    defaults:
      run:
        shell: bash
        working-directory: ./${{ matrix.source_dir }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.branch }}
    - name: Set up C#
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Install dependencies
      run: dotnet restore
    - name: Run tests and collect coverage (OpenCover)
      run: |
        dotnet test ../tests/${{ matrix.source_dir }} \
          --collect "XPlat Code Coverage" \
          --logger "trx;LogFileName=test-results.trx" \
          --results-directory ./TestResults \
          -- \
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
    - name: Run SonarQube scan
      id: sonarqube
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        PROJECT_KEY: "${{ needs.plan.outputs.sonar_prefix }}-${{ matrix.sonar_key }}"
        QUALITY_GATE_WAIT: ${{ inputs.sonar_quality_gate }}
        ISSUE_IGNORES: ${{ matrix.issue_ignores }}
      run: |
        # Issue exclusions, one "ruleKey|fileGlob" entry per ';' (e.g. constructors with many injected
        # dependencies: the S107 threshold can only be changed in the SonarQube quality profile, not here).
        ignore_args=()
        if [ -n "$ISSUE_IGNORES" ]; then
          ids=()
          i=0
          IFS=';' read -ra entries <<< "$ISSUE_IGNORES"
          for entry in "${entries[@]}"; do
            i=$((i + 1))
            ids+=("e$i")
            ignore_args+=("/d:sonar.issue.ignore.multicriteria.e$i.ruleKey=${entry%%|*}")
            ignore_args+=("/d:sonar.issue.ignore.multicriteria.e$i.resourceKey=${entry#*|}")
          done
          ignore_args+=("/d:sonar.issue.ignore.multicriteria=$(IFS=,; echo "${ids[*]}")")
        fi
        dotnet tool install --global dotnet-sonarscanner
        dotnet sonarscanner begin /k:"$PROJECT_KEY" \
          /d:sonar.host.url="$SONAR_HOST_URL" \
          /d:sonar.token="$SONAR_TOKEN" \
          /d:sonar.exclusions="**/Migrations/**" \
          /d:sonar.cpd.exclusions="**/DTO/**,**/Models/**" \
          /d:sonar.coverage.exclusions="${{ matrix.coverage_exclusions }}" \
          /d:sonar.qualitygate.wait="$QUALITY_GATE_WAIT" \
          /d:sonar.qualitygate.timeout=600 \
          /d:sonar.cs.vstest.reportsPaths=../${{ matrix.source_dir }}/TestResults/*.trx \
          /d:sonar.cs.opencover.reportsPaths=../${{ matrix.source_dir }}/TestResults/**/coverage.opencover.xml \
          "${ignore_args[@]}"
        dotnet build
        dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
    - name: SonarQube Summary
      if: ${{ !cancelled() && steps.sonarqube.outcome != 'skipped' }}
      uses: ./.github/actions/sonarqube-summary
      with:
        project-key: "${{ needs.plan.outputs.sonar_prefix }}-${{ matrix.sonar_key }}"
        sonar-host-url: ${{ secrets.SONAR_HOST_URL }}
        sonar-token: ${{ secrets.SONAR_TOKEN }}
        title: ${{ matrix.service_name }}
        fail-on-severities: ${{ inputs.sonar_fail_severities }}
        fail-on-qualities: ${{ inputs.sonar_fail_qualities }}

  test-frontend:
    name: tests - FRONT
    needs: plan
    if: needs.plan.outputs.front == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./electrostoreFRONT
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.branch }}
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
    - name: Install dependencies
      run: npm ci --ignore-scripts
    - name: Install test dependencies
      run: cd ../tests/electrostoreFRONT && npm ci --ignore-scripts
    - name: Run unit tests with coverage
      run: cd ../tests/electrostoreFRONT && npm run test:unit -- --coverage --coverage.reporter=lcov
    - name: Fix lcov source paths for SonarQube
      run: sed -i -E 's#^SF:(\.\./)+electrostoreFRONT/#SF:electrostoreFRONT/#' ../tests/electrostoreFRONT/coverage/lcov.info
    - name: Cypress run
      env:
        VITE_API_URL: http://localhost/vite_api_url_placeholder/api
      uses: cypress-io/github-action@v7
      with:
        start: npm run dev
        wait-on: 'http://localhost:5173'
        wait-on-timeout: 30
        working-directory: ./tests/electrostoreFRONT
    - name: Upload screenshots
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: cypress-screenshots
        path: tests/electrostoreFRONT/cypress/screenshots
    - name: SonarScanner
      id: sonarqube
      uses: SonarSource/sonarqube-scan-action@v8
      env:
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=${{ needs.plan.outputs.sonar_prefix }}-electrostore-front
          -Dsonar.projectName=${{ needs.plan.outputs.sonar_prefix }}-electrostore-front
          -Dsonar.sources=electrostoreFRONT
          -Dsonar.javascript.lcov.reportPaths=tests/electrostoreFRONT/coverage/lcov.info
          -Dsonar.issue.ignore.multicriteria=e1,e2
          -Dsonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S107
          -Dsonar.issue.ignore.multicriteria.e1.resourceKey=**/helpers/nestedResource.ts
          -Dsonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S107
          -Dsonar.issue.ignore.multicriteria.e2.resourceKey=**/stores/stores.store.ts
          -Dsonar.cfamily.cache.enabled=false
          -Dsonar.qualitygate.wait=${{ inputs.sonar_quality_gate }}
          -Dsonar.qualitygate.timeout=600
    - name: SonarQube Summary
      if: ${{ !cancelled() && steps.sonarqube.outcome != 'skipped' }}
      uses: ./.github/actions/sonarqube-summary
      with:
        project-key: "${{ needs.plan.outputs.sonar_prefix }}-electrostore-front"
        sonar-host-url: ${{ secrets.SONAR_HOST_URL }}
        sonar-token: ${{ secrets.SONAR_TOKEN }}
        title: FRONT
        fail-on-severities: ${{ inputs.sonar_fail_severities }}
        fail-on-qualities: ${{ inputs.sonar_fail_qualities }}
