name: Pull Request

on:
  pull_request:

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Modified Directories
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      cron: ${{ steps.filter.outputs.cron }}
      front: ${{ steps.filter.outputs.front }}
      notif: ${{ steps.filter.outputs.notif }}
      worker: ${{ steps.filter.outputs.worker }}
      testAPI: ${{ steps.filter.outputs.testAPI }}
      testCRON: ${{ steps.filter.outputs.testCRON }}
      testFRONT: ${{ steps.filter.outputs.testFRONT }}
      testNOTIF: ${{ steps.filter.outputs.testNOTIF }}
      testWORKER: ${{ steps.filter.outputs.testWORKER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            api: 'electrostoreAPI/**'
            cron: 'electrostoreCRON/**'
            front: 'electrostoreFRONT/**'
            notif: 'electrostoreNOTIF/**'
            worker: 'electrostoreWORKER/**'
            testAPI: 'tests/electrostoreAPI/**'
            testCRON: 'tests/electrostoreCRON/**'
            testFRONT: 'tests/electrostoreFRONT/**'
            testNOTIF: 'tests/electrostoreNOTIF/**'
            testWORKER: 'tests/electrostoreWORKER/**'
  
  quality:
    name: quality
    needs: detect-changes
    uses: ./.github/workflows/quality.yml
    with:
      branch: ${{ github.head_ref }}
      api: ${{ needs.detect-changes.outputs.api == 'true' }}
      cron: ${{ needs.detect-changes.outputs.cron == 'true' }}
      front: ${{ needs.detect-changes.outputs.front == 'true' }}
      notif: ${{ needs.detect-changes.outputs.notif == 'true' }}
      worker: ${{ needs.detect-changes.outputs.worker == 'true' }}
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit

  # Only fails on vulnerable dependencies introduced by this PR (manifest diff).
  # The full audit of existing dependencies runs in audit.yml (main/tags + schedule).
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          fail-on-scopes: runtime

  tests:
    name: tests
    needs: detect-changes
    uses: ./.github/workflows/tests.yml
    with:
      branch: ${{ github.head_ref }}
      sonar_prefix: PR-${{ github.event.pull_request.number }}
      sonar_fail_severities: BLOCKER,HIGH
      api: ${{ needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.testAPI == 'true' }}
      cron: ${{ needs.detect-changes.outputs.cron == 'true' || needs.detect-changes.outputs.testCRON == 'true' }}
      front: ${{ needs.detect-changes.outputs.front == 'true' || needs.detect-changes.outputs.testFRONT == 'true' }}
      notif: ${{ needs.detect-changes.outputs.notif == 'true' || needs.detect-changes.outputs.testNOTIF == 'true' }}
      worker: ${{ needs.detect-changes.outputs.worker == 'true' || needs.detect-changes.outputs.testWORKER == 'true' }}
    permissions:
      packages: write
      contents: read
    secrets: inherit
