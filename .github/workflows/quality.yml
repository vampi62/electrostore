name: quality

on:
  workflow_call:
    inputs:
      branch:
        description: 'The branch that triggered this workflow.'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      branch:
        description: 'The branch that triggered this workflow.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint-frontend:
    name: lint - FRONT
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./electrostoreFRONT
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.branch }}
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: electrostoreFRONT/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: ESLint
      run: npm run lint:check
    - name: Typecheck
      run: npm run typecheck

  lint-backend:
    name: lint - ${{ matrix.service_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service_name: API
            source_dir: electrostoreAPI
          - service_name: NOTIF
            source_dir: electrostoreNOTIF
          - service_name: CRON
            source_dir: electrostoreCRON
          - service_name: WORKER
            source_dir: electrostoreWORKER
    defaults:
      run:
        shell: bash
        working-directory: ./${{ matrix.source_dir }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.branch }}
    - name: Set up C#
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Install dependencies
      run: dotnet restore
    # Not blocking yet: there is no .editorconfig and the existing code base has
    # whitespace violations. Remove continue-on-error once it has been reformatted
    # with `dotnet format`.
    - name: Check formatting
      continue-on-error: true
      run: dotnet format --verify-no-changes --no-restore

  audit-dependencies:
    name: audit - ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            type: dotnet
            source_dir: electrostoreAPI
          - name: NOTIF
            type: dotnet
            source_dir: electrostoreNOTIF
          - name: CRON
            type: dotnet
            source_dir: electrostoreCRON
          - name: WORKER
            type: dotnet
            source_dir: electrostoreWORKER
          - name: FRONT
            type: npm
            source_dir: electrostoreFRONT
    defaults:
      run:
        shell: bash
        working-directory: ./${{ matrix.source_dir }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.branch }}
    - name: Set up C#
      if: matrix.type == 'dotnet'
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Audit NuGet packages
      if: matrix.type == 'dotnet'
      run: |
        dotnet restore
        # `dotnet list package` always exits 0, so fail on its report instead.
        dotnet list package --vulnerable --include-transitive 2>&1 | tee audit.txt
        if grep -q "has the following vulnerable packages" audit.txt; then
          echo "::error::Vulnerable NuGet packages found in ${{ matrix.name }}"
          exit 1
        fi
    - name: Set up Node.js
      if: matrix.type == 'npm'
      uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Audit npm packages (runtime dependencies)
      if: matrix.type == 'npm'
      run: npm audit --omit=dev --audit-level=high

  scan-secrets:
    name: scan - secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.branch }}
        fetch-depth: 0
    # Free for personal accounts. If the repo moves to an organization, a
    # GITLEAKS_LICENSE secret is required.
    - name: Gitleaks
      uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
