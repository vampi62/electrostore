name: arch

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

concurrency: ci-build-${{ github.ref }}

permissions:
  contents: write
  packages: write
  issues: read
  pull-requests: read
  deployments: write

jobs:
  init-work:
    name: Init work
    runs-on: ubuntu-latest
    outputs:
        VERSION: ${{ env.VERSION }}
        BRANCH: ${{ env.BRANCH }}
        RELEASE: ${{ env.RELEASE }}
        IS_TAG: ${{ env.IS_TAG }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract branch or tag name
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "IS_TAG=true" >> $GITHUB_ENV
            echo "BRANCH=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "IS_TAG=false" >> $GITHUB_ENV
            echo "BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
          fi

      - name: Init for main branch
        if: env.IS_TAG == 'false' && env.BRANCH == 'main'
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "VERSION=dev-${COMMIT_SHA::8}" >> $GITHUB_ENV
          echo "RELEASE=false" >> $GITHUB_ENV

      - name: Init for tag push (release)
        if: env.IS_TAG == 'true'
        shell: bash
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          echo "RELEASE=true" >> $GITHUB_ENV

      - name: Debug var
        shell: bash
        run: |
          echo "IS_TAG: ${{ env.IS_TAG }}"
          echo "BRANCH: ${{ env.BRANCH }}"
          echo "VERSION: ${{ env.VERSION }}"
          echo "RELEASE: ${{ env.RELEASE }}"

  tests:
    needs:
      - init-work
    uses: ./.github/workflows/tests.yml
    permissions:
      packages: write
      contents: read
    with:
      branch: ${{needs.init-work.outputs.BRANCH}}
    secrets: inherit

  build:
    needs:
      - init-work
      - tests
    uses: ./.github/workflows/build.yml
    permissions:
      packages: write
      contents: read
    with:
      architecture: 'linux/amd64,linux/arm64/v8'
      version: ${{needs.init-work.outputs.VERSION}}
      branch: ${{needs.init-work.outputs.BRANCH}}
      latest: ${{needs.init-work.outputs.RELEASE}}
    secrets: inherit

  release:
    needs:
      - init-work
      - build
    if: needs.init-work.outputs.RELEASE == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      issues: read
      contents: write
      packages: read
      pull-requests: read
      deployments: write
    with:
      version: ${{needs.init-work.outputs.VERSION}}
      branch: ${{needs.init-work.outputs.BRANCH}}
    secrets: inherit

  # ---------------------------------------------------------------
  # Automatic rollback if the tag was created but the pipeline failed at any point (tests, build or release).
  # This is to avoid having a tag in the repo that does not have a corresponding release or docker image.
  # ---------------------------------------------------------------
  rollback-on-failure:
    name: Rollback tag on failure
    runs-on: ubuntu-latest
    needs:
      - init-work
      - tests
      - build
      - release
    if: |
      always() &&
      needs.init-work.outputs.IS_TAG == 'true' &&
      contains(needs.*.result, 'failure')
    permissions:
      contents: write
    steps:
      - name: Delete remote tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ needs.init-work.outputs.BRANCH }}";
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`
              });
              core.notice(`Tag ${tag} deleted due to pipeline failure.`);
            } catch (e) {
              core.warning(`Failed to delete tag ${tag}: ${e.message}`);
            }

      - name: Delete GitHub release (if it was created)
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ needs.init-work.outputs.BRANCH }}";
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id
              });
              core.notice(`Release ${tag} deleted.`);
            } catch (e) {
              core.info(`No release to delete for ${tag} (${e.message}).`);
            }
