name: tests PR CRON

on:
  workflow_call:
    inputs:
      branch:
        description: 'The branch that triggered this workflow.'
        required: true
        type: string

jobs:
  test-cron:
    name: tests - CRON
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./electrostoreCRON
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.branch }}
    - name: Set up C#
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Install dependencies
      run: dotnet restore
    - name: Run tests and collect coverage (OpenCover)
      run: |
        dotnet test ../tests/electrostoreCRON \
          --collect "XPlat Code Coverage" \
          --logger "trx;LogFileName=test-results.trx" \
          --results-directory ./TestResults \
          -- \
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
    - name: Get PR ID
      id: get-pr-id
      run: |
        PR_ID="${{ github.event.pull_request.number }}"
        echo "pr_id=$PR_ID" >> $GITHUB_OUTPUT
    - name: Run SonarQube scan
      id: sonarqube
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        PROJECT_KEY: "PR-${{ steps.get-pr-id.outputs.pr_id }}-electrostore-cron"
      run: |
        dotnet tool install --global dotnet-sonarscanner
        dotnet sonarscanner begin /k:"$PROJECT_KEY" \
          /d:sonar.host.url="$SONAR_HOST_URL" \
          /d:sonar.token="$SONAR_TOKEN" \
          /d:sonar.exclusions="**/Migrations/**" \
          /d:sonar.cpd.exclusions="**/DTO/**,**/Models/**" \
          /d:sonar.coverage.exclusions="**/Program.cs" \
          /d:sonar.qualitygate.wait=true \
          /d:sonar.qualitygate.timeout=600 \
          /d:sonar.cs.vstest.reportsPaths=../electrostoreCRON/TestResults/*.trx \
          /d:sonar.cs.opencover.reportsPaths=../electrostoreCRON/TestResults/**/coverage.opencover.xml
        dotnet build
        dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
    - name: SonarQube Summary
      if: ${{ !cancelled() && steps.sonarqube.outcome != 'skipped' }}
      uses: ./.github/actions/sonarqube-summary
      with:
        project-key: "PR-${{ steps.get-pr-id.outputs.pr_id }}-electrostore-cron"
        sonar-host-url: ${{ secrets.SONAR_HOST_URL }}
        sonar-token: ${{ secrets.SONAR_TOKEN }}
        title: CRON
