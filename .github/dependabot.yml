version: 2

# Dependency bumps get their own `chore(deps)` PRs, kept out of feature PRs.
# Security updates (CVE) are opened by Dependabot as soon as an advisory is published
# (enable "Dependabot security updates" in the repository settings).
updates:
  - package-ecosystem: nuget
    directories:
      - /electrostoreAPI
      - /electrostoreNOTIF
      - /electrostoreCRON
      - /electrostoreWORKER
      - /tests/electrostoreAPI
      - /tests/electrostoreNOTIF
      - /tests/electrostoreCRON
      - /tests/electrostoreWORKER
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    # Pomelo.EntityFrameworkCore.MySql has no EF Core 10 release yet: Microsoft.EntityFrameworkCore*
    # must stay on 9.x or the API crashes at startup with a MissingMethodException.
    ignore:
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /electrostoreFRONT
      - /tests/electrostoreFRONT
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
