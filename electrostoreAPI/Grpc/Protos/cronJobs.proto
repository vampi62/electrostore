syntax = "proto3";

option csharp_namespace = "ElectrostoreAPI.Grpc";

package cronJobs;

service CronJobsGrpc {
  rpc GetEnabledCronJobs  (GetEnabledCronJobsRequest)  returns (GetEnabledCronJobsReply);
  rpc UpdateCronJobRun    (UpdateCronJobRunRequest)    returns (UpdateCronJobRunReply);
  rpc UpdateCronJobStatus (UpdateCronJobStatusRequest) returns (UpdateCronJobStatusReply);
}

// ---- Enums ----

enum CronJobAction {
  PACKAGE_TRACKING = 0;
  IA_RETRAIN = 1;
  STOCK_LOW_ALERT = 2;
}

enum CronJobExecutionStatus {
  IDLE = 0;
  RUNNING = 1;
  SUCCESS = 2;
  FAILED = 3;
  STOPPED = 4;
}

// ---- CronJobs ----

message GetEnabledCronJobsRequest {}

message GetEnabledCronJobsReply {
  repeated CronJobItem cron_jobs = 1;
}

message CronJobItem {
  int32  id_cronjob            = 1;
  string name_cronjob          = 2;
  string cron_expression_cronjob = 3;
  CronJobAction action_cronjob = 4;
  string params_cronjob        = 5; // JSON stringfied parameters, content depends on action_cronjob
  string last_run_at           = 6; // ISO 8601
  string next_run_at           = 7; // ISO 8601
}

// ---- Update CronJob Run ----

message UpdateCronJobRunRequest {
  int32  id_cronjob   = 1;
  string last_run_at  = 2; // ISO 8601
  string next_run_at  = 3; // ISO 8601
}

message UpdateCronJobRunReply {
  bool success = 1;
}

// ---- Update CronJob Status ----

message UpdateCronJobStatusRequest {
  int32  id_cronjob         = 1;
  CronJobExecutionStatus status_cronjob = 2;
  string last_error_cronjob = 3; // optional, empty when none
}

message UpdateCronJobStatusReply {
  bool success = 1;
}