apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-data
  labels:
    {{- include "es.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.garage.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
  labels:
    {{- include "es.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "es.selector" (dict "root" . "component" "garage") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "es.labels" . | nindent 8 }}
        {{- include "es.selector" (dict "root" . "component" "garage") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configs.yaml") . | sha256sum }}
    spec:
      # GARAGE_* variables injected for a Service named "garage" would be read as Garage settings.
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: garage
          image: {{ .Values.garage.image | quote }}
          ports:
            - { name: s3, containerPort: 3900 }
            - { name: rpc, containerPort: 3901 }
            - { name: admin, containerPort: 3903 }
          volumeMounts:
            - { name: config, mountPath: /etc/garage.toml, subPath: garage.toml, readOnly: true }
            - { name: data, mountPath: /data, subPath: data }
            - { name: data, mountPath: /meta, subPath: meta }
          # The admin port answers as soon as the process is up; the cluster layout is only
          # applied later by the garage-init Job, so /health (needs a layout) can't be used here.
          startupProbe:
            tcpSocket: { port: admin }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            tcpSocket: { port: admin }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: admin }
            periodSeconds: 30
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.garage.resources | nindent 12 }}
      volumes:
        - name: config
          secret:
            secretName: config-garage
        - name: data
          persistentVolumeClaim:
            claimName: garage-data
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  labels:
    {{- include "es.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
spec:
  selector:
    {{- include "es.selector" (dict "root" . "component" "garage") | nindent 4 }}
  # The garage-init Job configures the cluster before the node is "ready" in Garage terms.
  publishNotReadyAddresses: true
  ports:
    - { name: s3, port: 3900, targetPort: s3 }
    - { name: rpc, port: 3901, targetPort: rpc }
    - { name: admin, port: 3903, targetPort: admin }
