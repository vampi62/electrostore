{{- if .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels:
    {{- include "es.labels" . | nindent 4 }}
  annotations:
    # Created before everything else; pruned (with all its PVCs) when the Argo CD Application is deleted.
    argocd.argoproj.io/sync-wave: "-5"
{{- end }}
