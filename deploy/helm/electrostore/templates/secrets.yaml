apiVersion: v1
kind: Secret
metadata:
  name: credentials
  labels:
    {{- include "es.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
type: Opaque
stringData:
  mariadb-root-password: {{ include "es.mariadbRootPassword" . | quote }}
  mariadb-password: {{ include "es.mariadbPassword" . | quote }}
  mqtt-password: {{ include "es.mqttPassword" . | quote }}
  s3-access-key: {{ include "es.s3AccessKey" . | quote }}
  s3-secret-key: {{ include "es.s3SecretKey" . | quote }}
  garage-admin-token: {{ include "es.garageAdminToken" . | quote }}
